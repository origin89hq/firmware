# Open Code Review pilot; see origin89hq/engineering docs/code-review.md.
name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Pinned engineering commit; this job passes the secret to that code.
    uses: origin89hq/engineering/.github/workflows/ocr-review.yml@d919dceb997db469d62f2a896ae6be55ece543ca
    secrets:
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
