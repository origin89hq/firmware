# Open Code Review pilot; see origin89hq/engineering docs/code-review.md.
name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: origin89hq/engineering/.github/workflows/ocr-review.yml@lemarier/open-review
    secrets:
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
