# The gate. Everything here is `just check`, so a red run reproduces locally
# with one command. The toolchain, its components and both targets come from
# rust-toolchain.toml; nothing is pinned twice.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The registry, git dependencies and the dependencies' artifacts in both
      # target directories; never the workspace's own crates, which cargo
      # rebuilds from the checkout, and never the toolchain, which only the
      # step above installs. Keyed on the rustc it reports, both lockfiles
      # and rust-toolchain.toml. Saved from `main` alone: a pull request
      # restores and writes nothing (#201). Cargo fingerprints every
      # dependency by version, target and flags, so a restored artifact is
      # reused only where a clean build would compile the same one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            firmwares
          cache-bin: false
          save-if: true
          prefix-key: v0-sde
      # `espflash save-image` is how the comms image is measured: the bytes
      # the bootloader loads, not the ELF. Its release asset, pinned by version
      # and digest; the static musl build needs no library on the runner.
      - name: Install espflash 4.5.0
        run: |
          curl -sSfL -o espflash.zip https://github.com/esp-rs/espflash/releases/download/v4.5.0/espflash-x86_64-unknown-linux-musl.zip
          echo "542c5cc81f0cca384cbead1cacb7ccc9f35072a989b2de0fb95333d814272c22  espflash.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -q espflash.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm espflash.zip
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - run: just check
        env:
          SOURCE_DATE_EPOCH: '1790461599'
      - run: git diff --exit-code
      - run: sha256sum firmwares/target/*/release/*.bin
