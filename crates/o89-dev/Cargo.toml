[package]
name = "o89-dev"
version = "0.0.0"
description = "The bench tool: the controller's FRAM, NOR and rail over SWD, through the firmware's mailbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
o89-core = { path = "../o89-core" }
anyhow.workspace = true
clap.workspace = true
# The CRC the module's bootloader recomputes over an `otadata` entry.
crc.workspace = true
embassy-futures.workspace = true
getrandom.workspace = true
hex.workspace = true
km43.workspace = true
md-5.workspace = true
# The committed bootloader, held to the hash recorded beside it.
sha2.workspace = true
probe-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Terminal rendering only: no image or SVG dependencies. Host tool only.
[dependencies.qrcode]
version = "=0.14.1"
default-features = false

[dev-dependencies]
rqrr = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
