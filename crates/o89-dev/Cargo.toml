[package]
name = "o89-dev"
version = "0.0.0"
description = "The bench tool: the controller's FRAM, NOR and rail over SWD, through the firmware's mailbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# With `zeroize`, so every copy of the controller key and the generator's
# state the station reads or draws can be cleared (#242).
o89-core = { path = "../o89-core", features = ["zeroize"] }
anyhow.workspace = true
clap.workspace = true
# The CRC the module's bootloader recomputes over an `otadata` entry.
crc.workspace = true
embassy-futures.workspace = true
getrandom.workspace = true
hex.workspace = true
km43.workspace = true
md-5.workspace = true
# The committed bootloader, held to the hash recorded beside it.
sha2.workspace = true
probe-rs.workspace = true
# The station's controller records, one JSON object per line (P-249).
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Clears the host's copies of the controller key, the generator's state and
# the printed secret; already in the tree through km43. `alloc` for the
# station's reads of whole runs of the map, which hold both.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# Terminal rendering only: no image or SVG dependencies. Host tool only.
[dependencies.qrcode]
version = "=0.14.1"
default-features = false

[dev-dependencies]
rqrr = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
