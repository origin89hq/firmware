[package]
name = "o89-sim"
version = "0.0.0"
description = "The simulated site: the seams o89-core leaves, filled with faults on a laptop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
o89-core = { path = "../o89-core" }
# The comms processor's own link, which the hostile peer runs for
# everything it does honestly.
o89-comms-core = { path = "../o89-comms-core" }
embassy-futures.workspace = true
embedded-storage-async.workspace = true
km43.workspace = true

[dev-dependencies]
# Canonical traces from the same exact protocol pin; parser stays on the host.
km43 = { workspace = true, features = ["vectors"] }
serde_json = "=1.0.151"
# The comms processor's network stack, built on the laptop to show that
# each socket budget in `o89_comms_core::sockets` holds every socket the
# firmware and embassy-net open at once (`tests/comms_sockets.rs`). The same
# release and features as `firmwares/o89-comms`: `cargo xtask check` refuses
# the two drifting apart, because a feature is what adds embassy-net's own
# sockets.
embassy-net = { version = "=0.9.1", features = ["dhcpv4", "dhcpv4-hostname", "dns", "udp", "tcp", "medium-ethernet"] }
# The clock `embassy_net::new` reads: the mock, which a test advances by
# hand, so the DHCP client's resends are timed without waiting on them
# (`tests/comms_dhcp.rs`).
embassy-time = { version = "=0.5.1", features = ["mock-driver", "generic-queue-8"] }
# The mock clock takes a critical section; on the host, a mutex.
critical-section = { version = "=1.2.0", features = ["std"] }
# The DHCP client's retry timings in `tests/comms_dhcp.rs`, set as
# `firmwares/o89-comms` sets them: the release embassy-net resolves.
smoltcp = { version = "=0.13.1", default-features = false }

[lints]
workspace = true
