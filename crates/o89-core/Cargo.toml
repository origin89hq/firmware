[package]
name = "o89-core"
version = "0.0.0"
description = "The controller's decisions: host-testable, no allocator, names no peripheral"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `defmt::Format` on every public type, for the controller's log. Off on the
# host, where the tests read the types as Rust.
defmt = ["dep:defmt"]

[dependencies]
crc.workspace = true
km43.workspace = true
sha2.workspace = true
defmt = { workspace = true, optional = true }

[dev-dependencies]
embassy-futures.workspace = true

[lints]
workspace = true
