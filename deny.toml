# Copy to the Cargo workspace root; see engineering's docs/dependencies.md.
# Add a license or exception only after reading the crate's terms, and record why.

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained with no fix; only probe-rs in the o89-dev bench tool uses it. https://github.com/origin89hq/firmware/issues/221" },
]

[licenses]
# The shared list covers several repositories; unused entries are expected.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.exceptions]]
# 0BSD (license file read): use, copy, modify and distribute with no conditions.
crate = "managed"
allow = ["0BSD"]

[[licenses.exceptions]]
# 0BSD (license file read): use, copy, modify and distribute with no conditions.
crate = "smoltcp"
allow = ["0BSD"]

[[licenses.exceptions]]
# MPL-2.0 file-level copyleft; used only through probe-rs by the o89-dev host tool, unmodified and not in any firmware image.
crate = "serialport"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # Our protocol crate, pinned to a commit in Cargo.lock.
    "https://github.com/origin89hq/km43",
]
