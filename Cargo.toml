# The host workspace: what `cargo test` runs. The firmwares are a workspace of
# their own under `firmwares/`, excluded here so that `cargo clippy --workspace`
# never tries to build a Cortex-M0+ or a RISC-V crate for the laptop.
[workspace]
resolver = "3"
members = [
    "crates/o89-comms-core",
    "crates/o89-core",
    "crates/o89-dev",
    "crates/o89-link",
    "crates/o89-sim",
    "xtask",
]
exclude = ["firmwares"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/origin89hq/firmware"
publish = false

[workspace.dependencies]
# The one wire format. Pinned exactly and written here once for both
# workspaces; a member takes it with `.workspace = true` when it first needs it.
# 0.6.1 carries `EnterDownload`, L-034's link texts, the rules as data
# (`km43::REQUIREMENTS`), which the gate reads, the boot record's body, body
# decoders that refuse a repeated key, the controller records' bodies, the
# pairing-window report, and the identity and network configuration sections
# with their codecs; the same pin in both workspaces.
# Includes the metadata-free unwritten clear and rejects written version zero.
# 0.6.1 clears key material on drop and ships canonical vectors for host tests.
km43 = "=0.6.1"
# The dedup fingerprint is the leftmost eight bytes of SHA-256 over the
# operation bytes (P-120); the same release km43 hashes with.
sha2 = { version = "0.11", default-features = false }
# The checksum the ESP-IDF bootloader verifies a partition table by, which
# the bench tool recomputes before it acts on a table it read off a module.
# Not a security property and not ours: the format's, and the same
# generation as `sha2` so they share `digest`.
md-5 = { version = "0.11", default-features = false }
# The WebSocket opening handshake's accept key (RFC 6455 §4.2.2), the same
# generation as `sha2`. Not a security property: the handshake's.
sha1 = { version = "0.11", default-features = false }
# The NOR flash trait the ring is written against; the same release
# embassy's flash drivers implement.
embedded-storage-async = "=0.4.1"

anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
# The bench tool's link to the controller: the same release as the `probe-rs`
# binary the recipes flash with, pinned so that the two agree on the target.
probe-rs = "=0.32.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The printed secret is thirty-two bytes from the operating system's
# generator, shown once in hex.
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
syn = { version = "3", features = ["full", "visit"] }
toml = "1"

# `o89-core` derives `defmt::Format` behind a feature the controller turns on;
# the same pin as the firmware workspace, so the two lockfiles agree.
defmt = { version = "=1.1.1", default-features = false }
# The CRC every stored record carries, and a `block_on` for the host tests
# of the async storage seams. Both `no_std`, neither with an allocator.
crc = "3"
embassy-futures = "0.1"

# The rules the compiler enforces. `unsafe_code` is denied at the root and
# opened per item with `#[expect(unsafe_code, reason = "...")]`; the domain
# crates never need it. The clippy set is `pedantic` plus the restriction lints
# that turn the house rules into build failures: no `unwrap`, `expect`,
# `panic!`, `[]` indexing or unchecked arithmetic outside `#[cfg(test)]`.
# `clippy.toml` at the root lets tests keep `expect` and indexing.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A `# Errors` heading repeating what the `Result` says is ceremony; the
# function's doc says when it fails.
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
