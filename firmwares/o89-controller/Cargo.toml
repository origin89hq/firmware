[package]
name = "o89-controller"
version = "0.0.0"
description = "The controller: an adapter for o89-core against the board's peripherals, deciding nothing itself"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Links the image at the bottom of flash so a bench board boots it directly,
# with no bootloader in front of it. Not additive, and deliberately so: it
# changes where the image sits, which is exactly the kind of thing that must
# be asked for out loud. The build prints a warning when it is on, and an
# image built with it must never be flashed onto a unit that will take an
# update.
bench = []

[dependencies]
embassy-executor = { workspace = true, features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { workspace = true, features = ["defmt"] }

# The part. `memory-x` is off on purpose: it would emit the part's 512 KB,
# and the budget is one slot less the bootloader. See memory.x.
embassy-stm32 = { version = "=0.6.0", features = [
    "stm32g0b1re",
    "time-driver-any",
    "defmt",
] }
cortex-m.workspace = true
cortex-m-rt.workspace = true
portable-atomic = { workspace = true, features = ["critical-section"] }

defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true

[lints]
workspace = true
