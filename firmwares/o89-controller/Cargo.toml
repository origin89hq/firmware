[package]
name = "o89-controller"
version = "0.0.0"
description = "The controller: an adapter for o89-core against the board's peripherals, deciding nothing itself"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Links the image at the bottom of flash so a bench board boots it directly,
# with no bootloader in front of it, and carries the one-shot proofs: a
# starvation on a boot the watchdog did not cause, a panic on the boot that
# follows. Not additive, and deliberately so: it changes where the image
# sits, which is exactly the kind of thing that must be asked for out loud.
# The build prints a warning when it is on, and an image built with it must
# never be flashed onto a unit that will take an update.
bench = []
# Halts on a panic with the message on the probe instead of writing the last
# words and resetting. For chasing a panic at the bench, and nothing else: a
# bench run that proves the panic path runs without it.
panic-probe = ["dep:panic-probe"]

[dependencies]
o89-core = { path = "../../crates/o89-core", features = ["defmt"] }
embedded-storage-async.workspace = true
km43.workspace = true

embassy-executor = { workspace = true, features = [
    "platform-cortex-m",
    "executor-thread",
    # The supervisor runs from an interrupt above the thread executor, so
    # a task that blocks the executor is still named before the reset.
    "executor-interrupt",
    "defmt",
] }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures.workspace = true
static_cell.workspace = true
embedded-io-async.workspace = true

# The part. `memory-x` is off on purpose: it would emit the part's 512 KB,
# and the budget is one slot less the bootloader. See memory.x.
embassy-stm32 = { version = "=0.6.0", features = [
    "stm32g0b1re",
    "time-driver-any",
    "defmt",
] }
# The registers the first statements and the reset cause need before the HAL
# owns anything: the same release the HAL builds on, so the lockfile holds
# one copy.
stm32-metapac = { version = "=21.0.0", features = ["stm32g0b1re", "pac"] }
cortex-m.workspace = true
# `set-vtor`: the runtime points `VTOR` at this image's own vector table
# before `main`. The bootloader jumps here without touching `VTOR`, and a
# bench image at the bottom of flash needs nothing done either way.
cortex-m-rt = { workspace = true, features = ["set-vtor"] }
portable-atomic = { workspace = true, features = ["critical-section"] }

defmt.workspace = true
defmt-rtt.workspace = true
# Bench only: production writes the reason to the last words and resets.
panic-probe = { workspace = true, optional = true }

[lints]
workspace = true
