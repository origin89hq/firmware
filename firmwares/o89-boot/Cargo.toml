[package]
name = "o89-boot"
version = "0.0.0"
description = "The controller's bootloader: the generator lines to their fail state, an update staged on the NOR copied or rolled back, the trial boot counted"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
# The registers, and nothing above them: a bootloader that fits in 32 KB has
# no room for a HAL and nothing to do that needs one. The same release the
# controller's HAL builds on, so the lockfile holds one copy.
stm32-metapac = { version = "=21.0.0", features = ["stm32g0b1re", "pac"] }

[lints]
workspace = true
