[package]
name = "o89-comms"
version = "0.0.0"
description = "The comms processor: a pipe the controller does not trust, and the download window that recovers it"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This crate must never depend on `o89-core`. It is the untrusted half, and a
# comms processor that could reach a decision is one that could make one.
# `cargo xtask check` refuses the dependency.
[features]
# The frames bench (F-087): once the link is up the module sends ten
# thousand worst-case frames at the link's rate, in batches between turns
# of its loop so the controller's heartbeats are still answered and the
# recovery ladder never cuts the rail mid-run. The controller counts what
# arrives (`just run-controller-frames`). Never on a unit that ships: it
# puts megabytes on the link and answers nothing with them.
frames = ["dep:o89-link", "o89-comms-core/frames"]
# Bench sender ignores CTS; pair with the controller's no-flow image.
no-flow = ["frames"]
# The cut bench (F-086): the frames bench with the pair pulled on the wire
# a thousand times, by the sender itself. The first frame of every three is
# cut short of its delimiter, the second runs into the fragment and is
# refused with it, the third must arrive whole. Pair with
# `run-controller-frames`, whose counters read the outcome.
cuts = ["frames"]
# The two images #1's acceptance test delivers as updates (F-088, F-089),
# never on a unit that ships. `crash-at-boot` panics as its first
# statement, before the watchdog, the UART and the window: the image a bad
# release would be. `no-window` omits the window, and with it the only
# proof the slot could be confirmed against, so it runs and links until its
# next reset puts the previous image back.
crash-at-boot = []
no-window = []
# The image for an ESP32-C6 devkit on its own USB serial (`just
# run-comms-devkit`): the same firmware, stating the devkit as its board in
# every `LinkUp` rather than board A (L-034). Nothing else moves.
devkit = []

[dependencies]
# The part. `unstable` is what carries UART flow control, the watchdogs, the
# true random source and the register block the download window writes.
esp-hal = { version = "=1.2.2", features = ["esp32c6", "unstable"] }
# The scheduler the radio will need and the executor the link runs on.
esp-rtos = { version = "=0.4.0", features = ["esp32c6", "embassy", "esp-radio", "esp-alloc"] }
# The application descriptor the ROM bootloader reads before it runs anything,
# the partition table, and the OTA state the window's completion confirms.
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
esp-storage = { version = "=0.10.0", features = ["esp32c6"] }
# No `esp-backtrace`: it insists on printing, and the module's only wire on
# board A is the link, which no text may enter (#2). A panic resets the part
# (`panic.rs`), and a RISC-V fault, which no Rust handler sees, is a hang
# the watchdog ends the same way.
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-futures.workspace = true
# The executor's home: entered once, at the end of the boot.
static_cell.workspace = true
km43.workspace = true
# The window's and the link's rules, where the host tests them.
o89-comms-core = { path = "../../crates/o89-comms-core" }
# The worst-case payload, written once so a test and a bench mean the same
# thing by it. Only the frames bench needs it.
o89-link = { path = "../../crates/o89-link", optional = true }

# Radio-only heap; all application buffers remain static.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "wifi", "unstable"] }
esp-alloc = "=0.11.0"
# Country-code lookup in the same blob as esp-radio; no guessed channel table.
esp-wifi-sys-esp32c6 = "=0.3.0"
embassy-net = { version = "=0.9.1", features = ["dhcpv4", "dhcpv4-hostname", "dns", "udp", "tcp", "medium-ethernet"] }
# The TCP socket's reads and writes, the release embassy-net implements.
embedded-io-async = "=0.7.0"
# The access point's DHCP server: packets and leases only, with no I/O of
# its own and no allocation; a UDP socket of ours carries it.
edge-dhcp = { version = "=0.8.0", default-features = false }
embassy-sync.workspace = true

[lints]
workspace = true
