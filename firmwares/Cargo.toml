# The firmwares build for their own targets and never for the host, so they
# are a workspace of their own with a lockfile of their own. The host
# workspace excludes this directory; `cargo xtask check` builds from here.
[workspace]
resolver = "3"
members = ["o89-boot", "o89-controller", "o89-comms"]

# The same as the root's on purpose: two workspaces are two lockfiles, and the
# edition and the compiler are the part that must not drift quietly.
[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/origin89hq/firmware"
publish = false

# Pinned exactly. Embassy and esp-hal move under a caret, and a toolchain that
# moves in January is a winter lost. Moving a pin is a commit that names the
# release note it read and the bench that revalidated it.
#
# Only what more than one crate wants is here. Anything that names a chip —
# `embassy-stm32`, `esp-hal` — belongs to the crate that names it.
[workspace.dependencies]
# 0.6.1, the same pin as the host workspace: `EnterDownload`, L-034's link
# texts, the boot record's body, decoders that refuse a repeated key, the
# controller records' bodies, the pairing-window report, the configuration
# sections, and the `defmt` feature the core enables.
# Includes the metadata-free unwritten clear and rejects written version zero.
# 0.6.1 clears key material on drop and ships canonical vectors for host tests.
# 0.6.3 retains Wi-Fi diagnostics (P-216–P-221, L-200–L-207) and adds client enrolment storage.
km43 = "=0.7.0"

embassy-executor = { version = "=0.10.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-futures = { version = "=0.1.2", default-features = false }
# The NOR flash trait the ring is written against; the same release
# embassy's flash drivers implement.
embedded-storage-async = "=0.4.1"
# The traits the buffered UART reads and writes through; the release the
# pinned embassy-stm32 implements.
embedded-io-async = "=0.7.0"

defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
heapless = { version = "=0.9.3", default-features = false }
static_cell = "=2.1.1"

# The Cortex-M0+ has load and store atomics and no compare-and-swap, and half
# the ecosystem assumes CAS. `portable-atomic` shims it through a critical
# section, and `cortex-m`'s `critical-section-single-core` is what provides
# one: without it the link fails on `_critical_section_1_0_acquire` and names
# no crate in any manifest.
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.6"
portable-atomic = { version = "=1.15.0", default-features = false }
# Bench only. Production writes the reason to FRAM and resets.
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

# At the workspace root, because cargo ignores a member's profile and says so
# in a warning that is easy to read past. Every byte is worth something in a
# 248 KB slot, and `debug = true` costs nothing there: DWARF stays in the ELF.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
overflow-checks = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# Embassy at a revision of its `main`, exactly, and every crate of it at the
# same one: `embassy-stm32` takes its siblings by path inside that
# repository, so a single crate from git would put a second copy of
# `embassy-time-driver` in the build, which is a `links` crate and does not
# link twice. `stm32-metapac` follows the revision the HAL builds against,
# so the controller's own register writes and the HAL's are the same crate.
#
# Why a revision and not a release: 0.6.0's buffered UART reads the data
# register on every interrupt even when its ring is full, so the byte is
# dropped and the hardware never asserts `RTS`; flow control cannot hold the
# module off for a task that is late, and nothing counts the loss (#66).
# Upstream's 844c4e7b, after 0.6.0 and unreleased, reads the register only
# when the ring has room and masks the receive interrupt until it does
# (F-090). This pin goes back to a release when one carries that commit.
#
# Known and not reported upstream: `embassy-stm32` builds
# `embassy-hal-internal` with `prio-bits-4` for every STM32, and the M0+
# implements two. `Priority::P2` and `P3` are `0x20` and `0x30`, which the
# NVIC truncates to 0, so only `P0`, `P4`, `P8` and `P12` are real here
# (bench 2026-09-25). `supervisor.rs` asserts that at compile time; when this
# pin moves, check whether upstream now selects the chip's own bit count.
[patch.crates-io]
# km43 at roles, invites and removal (origin89hq/km43#138), with key
# agreement (#130), the retired write counter (#134), vouching (#137) and
# the asynchronous DRBG store (#136) before it. The pin moves to `=0.8.0`
# with the last of #178, when every type that release adds is answered.
km43 = { git = "https://github.com/origin89hq/km43", rev = "0f94f45e4554ab3889408bb76952cf6eb90dd484" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
embassy-usb-synopsys-otg = { git = "https://github.com/embassy-rs/embassy", rev = "77afe6cf4ac346c15b78d5991ae40fdbc3e300e8" }
stm32-metapac = { git = "https://github.com/embassy-rs/stm32-data-generated", tag = "stm32-data-3b1e9bcf7cd6a04e2ccb74182b22ded50d264723" }
