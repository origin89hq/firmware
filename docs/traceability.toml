# Requirements nothing can test, and a count of the ones nobody has tested yet.
#
# `cargo xtask check` sorts every **F-nnn** in REQUIREMENTS.md into three
# buckets: covered by a `#[test]` named after it that invokes an assertion,
# or by a check of the gate nominated below; declared here with a kind and a reason
# somebody argued for in review; or uncovered. Uncovered means nobody has
# written the test. Untestable means no test can be written. Filling this
# file with `deferred` entries to make the count go down turns the first word
# into the second, which is the graveyard this file exists to not become.
#
# The KM43 rules this repository's tests cite are counted against the rules
# the pinned km43 ships, `km43::REQUIREMENTS` (origin89hq/km43#31), and
# reported, not ratcheted.
#
# A KM43 rule binding both firmwares reads as covered once either side has
# its test, so the halves still missing are named here:
# - L-102: the controller's half is tested against the simulated peer; the
#   comms processor's count, its close report and the re-announce wait on
#   the comms connection table (#90).

# Configuration section storage: P-100 to P-103, P-106 to P-108 have host
# checks. L-133 to L-135 cover controller pushes and factory clear on HostileComms.
# L-133 and L-137 cover unwritten clears, damaged-record reset, no push at zero,
# unanswered retries, and retry after a failed erase at the next LinkUp.
# Comms storage tests cover durable absence and erase failure; radio shutdown
# and reconfiguration still need bench evidence.
# The phone-to-Wi-Fi bench exit remains open and requires comms #90.

