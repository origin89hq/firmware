# The list somebody defends at each audit round: the F rules that have
# neither a test nor a declaration below, by name. The check fails when a
# rule is uncovered and not listed — a new rule nobody listed, or a test that
# went missing — and fails when a listed rule has a test now, so the list only
# shrinks. By name and not by count, because a count lets one rule lose its
# test while another gains one and reads unchanged. A rule joins the list in
